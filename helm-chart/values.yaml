# ── Image ─────────────────────────────────────────────────────────
image:
  repository: your-dockerhub-username/java-cicd-app
  tag: "1"          # Jenkins automatically updates this value
  pullPolicy: Always

# ── Replicas ───────────────────────────────────────────────────────
replicaCount: 2

# ── Service ────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# ── Resources ──────────────────────────────────────────────────────
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# ── Liveness & Readiness Probes ────────────────────────────────────
livenessProbe:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 5
